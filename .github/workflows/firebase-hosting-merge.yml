# This file was auto-generated by the Firebase CLI, then hand-edited:
# - added pnpm/Node setup (the generated build step assumed pnpm was
#   already on the runner, which it isn't by default)
# - added `target: production` since firebase.json defines two hosting
#   configs (production/staging) and the deploy action needs to know
#   which one this workflow is for

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRUVIU_497408 }}
          channelId: live
          target: production
          projectId: pruviu-497408
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
