# This file was auto-generated by the Firebase CLI, then hand-edited:
# - added pnpm/Node setup (the generated build step assumed pnpm was
#   already on the runner, which it isn't by default)
# - added `target: staging` since firebase.json defines two hosting
#   configs (production/staging), and PR previews should never touch
#   the production site even via an ephemeral preview channel

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRUVIU_497408 }}
          target: staging
          projectId: pruviu-497408
